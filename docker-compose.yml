services:
  chroma-server:
    build:
      context: ./chromadb
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: curl -f http://localhost:8000/api/v1/heartbeat || exit 1
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 10s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    depends_on:
      chroma-server:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CHROMA_HOST: chroma-server
      CHROMA_PORT: 8000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HF_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      HF_GENERATION_MODEL: google/flan-t5-large
      HF_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      DISABLE_AUTH: "0"
      JWT_SECRET: change-this-to-a-strong-secret
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_MINUTES: 1
      OLLAMA_BASE_URL: ""
      OLLAMA_MODEL: "qwen2.5:3b"
    restart: unless-stopped

volumes:
  chroma-data:
  minio-data:
  redis-data:
