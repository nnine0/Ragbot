<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragbot</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c0a1d;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.app{display:flex;height:100vh}
.sidebar{width:320px;background:#12102a;border-right:1px solid #1e1b3e;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:20px;border-bottom:1px solid #1e1b3e}
.sidebar-header h1{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-header p{font-size:0.75rem;color:#64748b;margin-top:2px}
.upload-zone{border:2px dashed #1e1b3e;border-radius:10px;margin:16px;padding:24px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover,.upload-zone.dragover{border-color:#818cf8;background:#1a1540}
.upload-zone .icon{font-size:1.8rem;margin-bottom:6px}
.upload-zone p{color:#94a3b8;font-size:0.8rem}
.upload-zone .hint{font-size:0.7rem;color:#64748b;margin-top:4px}
.doc-list{flex:1;overflow-y:auto;padding:0 16px 16px}
.doc-list h3{font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;padding:12px 4px 8px}
.doc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:4px;font-size:0.82rem;transition:background .15s}
.doc-item:hover{background:#1a1540}
.doc-item .icon{font-size:1.1rem}
.doc-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item .badge{font-size:0.65rem;padding:2px 8px;border-radius:10px;background:#1e293b;color:#94a3b8}
.doc-item .badge.done{background:#064e3b;color:#6ee7b7}
.sidebar-footer{padding:16px;border-top:1px solid #1e1b3e;font-size:0.7rem;color:#475569;text-align:center}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:16px 24px;border-bottom:1px solid #1e1b3e;display:flex;align-items:center;justify-content:space-between}
.chat-header h2{font-size:0.95rem;font-weight:600}
.chat-header .status{font-size:0.75rem;color:#64748b;display:flex;align-items:center;gap:6px}
.chat-header .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:10px;line-height:1.6;font-size:0.9rem;animation:fadeIn .2s}
.msg.user{background:#4f46e5;align-self:flex-end;border-bottom-right-radius:4px}
.msg.bot{background:#1a1540;align-self:flex-start;border-bottom-left-radius:4px}
.msg.bot .sources{font-size:0.72rem;color:#64748b;margin-top:8px;padding-top:8px;border-top:1px solid #1e1b3e}
.msg.bot .files{font-size:0.72rem;color:#818cf8;margin-top:4px}
.msg.system{background:transparent;color:#64748b;font-size:0.78rem;align-self:center;padding:4px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.input-area{padding:16px 24px 24px;border-top:1px solid #1e1b3e}
.input-row{display:flex;gap:8px;background:#12102a;border:1px solid #1e1b3e;border-radius:12px;padding:4px;align-items:center}
.input-row input{flex:1;background:transparent;border:none;color:#e2e8f0;padding:10px 14px;font-size:0.9rem;outline:none}
.input-row input::placeholder{color:#475569}
.input-row button{background:#4f46e5;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;transition:background .15s;font-size:0.85rem}
.input-row button:hover{background:#4338ca}
.input-row button:disabled{opacity:.4;cursor:not-allowed}
.status-bar{display:flex;align-items:center;gap:8px;padding:4px 24px;font-size:0.78rem;color:#64748b}
.spinner{width:12px;height:12px;border:2px solid #1e1b3e;border-top-color:#818cf8;border-radius:50%;animation:spin .6s linear infinite;display:none}
.spinner.active{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.samples{display:flex;gap:6px;padding:0 24px;flex-wrap:wrap}
.samples button{background:none;border:1px solid #1e1b3e;color:#64748b;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:0.75rem;transition:all .15s}
.samples button:hover{border-color:#818cf8;color:#e2e8f0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-content{background:#12102a;border:1px solid #1e1b3e;border-radius:12px;padding:24px;width:400px;max-width:90%}
.modal-content h3{margin-bottom:12px;font-size:1rem}
.modal-content input{width:100%;background:#0c0a1d;border:1px solid #1e1b3e;color:#e2e8f0;padding:10px 14px;border-radius:8px;font-size:0.9rem;outline:none;margin-bottom:12px;margin-top:4px}
.modal-content .btn-row{display:flex;gap:8px;justify-content:flex-end}
.modal-content .btn-row button{padding:8px 16px;border-radius:6px;border:none;font-weight:600;cursor:pointer;font-size:0.85rem}
.modal-content .btn-row .primary{background:#4f46e5;color:#fff}
.modal-content .btn-row .secondary{background:#1e293b;color:#94a3b8}
.typing-dots::after{content:'';animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%,20%{content:''}40%{content:'.'}60%{content:'..'}80%,100%{content:'...'}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Ragbot</h1>
      <p>Chat with your documents</p>
    </div>

    <div class="upload-zone" id="drop-zone">
      <div class="icon">📄</div>
      <p>Drop files or click to upload</p>
      <p class="hint">PDF, TXT, DOCX, MD, CSV, HTML, JSON</p>
    </div>
    <input type="file" id="file-input" style="display:none" accept=".pdf,.txt,.docx,.md,.csv,.html,.json,.doc" multiple>

    <div class="doc-list" id="doc-list">
      <h3>Documents</h3>
      <div id="docs-container"></div>
      <div id="empty-docs" style="text-align:center;padding:20px;color:#475569;font-size:0.8rem">No documents yet — upload to start chatting</div>
    </div>

    <div class="sidebar-footer">
      <span id="auth-status">Connecting...</span>
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      <div>
        <h2>Chat</h2>
        <div class="status"><span class="dot"></span> <span id="model-status">Ready</span></div>
      </div>
      <button class="samples" style="border:none;background:none;padding:0" onclick="clearChat()">
        <span style="color:#64748b;font-size:0.75rem;cursor:pointer">&times; Clear chat</span>
      </button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="samples" id="samples-bar">
      <button onclick="ask('What is this document about?')">What is this about?</button>
      <button onclick="ask('Summarize the key points')">Summarize key points</button>
      <button onclick="ask('List all important details')">List important details</button>
    </div>

    <div class="status-bar" id="status-bar">
      <div class="spinner" id="spinner"></div>
      <span id="status-text"></span>
    </div>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="question-input" placeholder="Ask a question about your documents..." autofocus>
        <button id="ask-btn" onclick="ask()">Ask</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="auth-modal">
  <div class="modal-content">
    <h3>Welcome to Ragbot</h3>
    <p style="color:#94a3b8;font-size:0.85rem;margin-bottom:12px">Enter your name or identifier to get started</p>
    <input type="text" id="username-input" placeholder="Your name (e.g. alice)" value="user_">
    <div class="btn-row">
      <button class="secondary" onclick="document.getElementById('auth-modal').classList.remove('show')">Cancel</button>
      <button class="primary" onclick="login()">Start Chatting</button>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'ragbot_token';
const USER_KEY = 'ragbot_user';
let currentAbort = null;
let autoToken = null;

function $(id) { return document.getElementById(id); }

async function login() {
  const u = $('username-input').value.trim() || 'user_' + Math.random().toString(36).slice(2, 8);
  try {
    const res = await fetch('/auth/token', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user_id: u}) });
    const d = await res.json();
    autoToken = d.access_token;
    localStorage.setItem(TOKEN_KEY, autoToken);
    localStorage.setItem(USER_KEY, u);
    $('auth-modal').classList.remove('show');
    $('auth-status').textContent = 'Logged in as ' + u;
    refreshDocs();
  } catch (e) {
    $('auth-status').textContent = 'Server unreachable — is the API running?';
  }
}

function getToken() { return autoToken || localStorage.getItem(TOKEN_KEY) || ''; }

(async function init() {
  const saved = localStorage.getItem(TOKEN_KEY);
  const user = localStorage.getItem(USER_KEY);
  if (saved && user) {
    autoToken = saved;
    $('auth-status').textContent = 'Logged in as ' + user;
    refreshDocs();
  } else {
    $('auth-modal').classList.add('show');
    const chars = 'abcdefghijklmnopqrstuvwxyz';
    $('username-input').value = 'user_' + Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  }
})();

const dropZone = $('drop-zone');
const fileInput = $('file-input');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); for (const f of e.dataTransfer.files) uploadFile(f); });
fileInput.addEventListener('change', () => { for (const f of fileInput.files) uploadFile(f); fileInput.value = ''; });

async function uploadFile(file) {
  const token = getToken();
  if (!token) { $('auth-modal').classList.add('show'); return; }

  addMsg('system', 'Uploading ' + file.name + '...');
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/upload', { method:'POST', headers:{'Authorization':'Bearer '+token}, body:form });
    const d = await res.json();
    if (res.ok) {
      addMsg('system', 'Indexed ' + file.name + ' (' + d.chunks + ' chunks)');
      refreshDocs();
    } else {
      addMsg('system', 'Upload failed: ' + (d.detail || 'error'));
    }
  } catch (err) {
    addMsg('system', 'Upload error: ' + err.message);
  }
}

async function refreshDocs() {
  const token = getToken();
  if (!token) return;
  try {
    const res = await fetch('/documents', { headers:{'Authorization':'Bearer '+token} });
    const d = await res.json();
    const container = $('docs-container');
    const empty = $('empty-docs');
    if (d.documents && d.documents.length > 0) {
      container.innerHTML = d.documents.map(f =>
        `<div class="doc-item"><span class="icon">${getIcon(f)}</span><span class="name">${f}</span><span class="badge done">indexed</span></div>`
      ).join('');
      empty.style.display = 'none';
    } else {
      container.innerHTML = '';
      empty.style.display = 'block';
    }
  } catch (e) {}
}

function getIcon(fn) {
  const e = fn.split('.').pop().toLowerCase();
  if (e === 'pdf') return '📕';
  if (['doc','docx'].includes(e)) return '📘';
  if (e === 'txt') return '📄';
  if (e === 'md') return '📝';
  if (e === 'csv') return '📊';
  return '📄';
}

function addMsg(type, content, sources, filenames) {
  const m = $('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  if (type === 'bot' && typeof content === 'string') {
    d.innerHTML = '<div class="content"></div>';
    if (sources) d.querySelector('.content').dataset.sources = JSON.stringify(sources);
    if (filenames) d.querySelector('.content').dataset.filenames = JSON.stringify(filenames);
    d.querySelector('.content').textContent = content;
  } else if (type === 'bot' && typeof content === 'object') {
    d.innerHTML = '<div>' + content.answer + '</div>';
    if (content.sources && content.sources.length) d.innerHTML += '<div class="sources">Chunks: ' + content.sources.slice(0,3).join(', ') + '</div>';
    if (content.filenames && content.filenames.length) d.innerHTML += '<div class="files">From: ' + content.filenames.join(', ') + '</div>';
  } else {
    d.textContent = content;
  }
  m.appendChild(d);
  m.scrollTop = m.scrollHeight;
  return d;
}

function setStatus(text, loading) {
  $('status-text').textContent = text;
  $('spinner').classList.toggle('active', loading);
}

function clearChat() {
  $('messages').innerHTML = '';
}

async function ask(q) {
  const token = getToken();
  if (!token) { $('auth-modal').classList.add('show'); return; }

  if (currentAbort) { currentAbort.abort(); currentAbort = null; }

  const question = q || $('question-input').value.trim();
  if (!question) return;

  if (!q) $('question-input').value = '';
  addMsg('user', question);

  const answerDiv = addMsg('bot', '▊');
  let answerText = '';
  let foundAnswer = false;

  currentAbort = new AbortController();
  $('ask-btn').disabled = true;
  setStatus('Searching...', true);

  try {
    const res = await fetch('/ask?question=' + encodeURIComponent(question), {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token},
      signal: currentAbort.signal,
    });

    if (!res.ok) {
      const err = await res.json();
      answerDiv.querySelector('.content').textContent = 'Error: ' + (err.detail || 'Unknown error');
      setStatus('', false);
      $('ask-btn').disabled = false;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let curEvent = '';
    let sources = [];
    let filenames = [];

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buf += decoder.decode(value, {stream: true});
      const parts = buf.split('\n');
      buf = parts.pop() || '';

      for (const line of parts) {
        if (line.startsWith('event: ')) { curEvent = line.slice(7).trim(); }
        else if (line.startsWith('data: ')) {
          const data = line.slice(6).trim();
          if (curEvent === 'token') {
            answerText += data;
            answerDiv.querySelector('.content').textContent = answerText;
            $('messages').scrollTop = $('messages').scrollHeight;
          } else if (curEvent === 'status') {
            setStatus(data, true);
          } else if (curEvent === 'error') {
            answerDiv.querySelector('.content').textContent = 'Error: ' + data;
            setStatus('', false);
          } else if (curEvent === 'done') {
            try {
              const r = JSON.parse(data);
              answerText = r.answer || answerText;
              sources = r.sources || [];
              filenames = r.filenames || [];
              answerDiv.innerHTML = '<div>' + answerText + '</div>';
              if (sources.length) answerDiv.innerHTML += '<div class="sources">Chunks: ' + sources.slice(0,3).join(', ') + '</div>';
              if (filenames.length) answerDiv.innerHTML += '<div class="files">From: ' + filenames.join(', ') + '</div>';
            } catch(e) { answerDiv.querySelector('.content').textContent = 'Parse error'; }
          }
        }
      }
    }
    setStatus('', false);
  } catch (err) {
    if (err.name === 'AbortError') return;
    const c = answerDiv.querySelector('.content');
    if (c) c.textContent = 'Error: ' + err.message;
    setStatus('', false);
  } finally {
    $('ask-btn').disabled = false;
    currentAbort = null;
  }
}

$('question-input').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
